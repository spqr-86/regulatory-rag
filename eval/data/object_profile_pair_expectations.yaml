# Expectations for the v1/v2 object profile pair run (spec object-profile §5.2).
# Written and committed BEFORE the run. Sources are document_id + section/point,
# never dynamic ids like int_001 / obj_s5.
# Norm blocks (n: 1, 2, 7) are lists: compound questions rest on more than one point.
# Official edition checked 15.09.2026 against pravo.gov.ru, nd=102861524
# (ПП РФ от 16.09.2020 № 1479, статус «Действует c изменениями», последняя редакция
# от 03.02.2025 № 90); corpus text of every listed point matches the official wording.
meta:
  spec: docs/superpowers/specs/2026-09-16-typed-object-sheet-design.md
  object_sheet_schema: typed_fields_v1
  baseline_note: листы и их sha изменены; следующий прогон v2 является новой базой и не сравнивается напрямую с прогонами 15–16.09
  model: gpt-4o-mini
  temperature: 0
  partial_credit_rule: a required sub-answer counts only if no forbidden conclusion is present
  ppr_edition: ПП РФ № 1479 в ред. от 03.02.2025 № 90; действует до 31.12.2026 включительно (п. 2 постановления)
questions:
  - n: 1
    unit_id: unit_office
    question: Сколько огнетушителей должно быть на объекте и нужен ли план эвакуации?
    checks: составной вопрос, требуемое ≠ фактическое
    required_subanswers:
      - в общественном здании на каждом этаже не менее 2 огнетушителей с рангом по приложению № 1 ПП РФ № 1479, расстояние до огнетушителя не более 20 м для помещений административного и общественного назначения
      - фактически в зоне офиса 2 огнетушителя ОП-4
      - точное требуемое количество по объекту из сведений не определяется — категорирование помещений отсутствует
      - необходимость плана эвакуации зависит от численности людей в здании (50 и более) или постоянных рабочих мест на этаже (10 и более); численность на 3 этаже бизнес-центра не известна
    accepted_alternatives:
      - вывод о плане в условной форме («нужен, если на этаже 10 и более постоянных рабочих мест или в здании 50 и более человек»)
      - вопрос в clarifying_questions о численности людей на этаже или в здании бизнес-центра
      - упоминание, что на этаже размещён поэтажный план эвакуации бизнес-центра
      - источник нормы по огнетушителям — п. 5.13.3 Инструкции о мерах ПБ вместо п. 400 ПП РФ № 1479
    forbidden_conclusions:
      - план эвакуации офису не нужен (не требуется)
      - план эвакуации нужен, потому что в офисе 50 и более человек или 10 и более рабочих мест
      - количество огнетушителей снижается на 50 % из-за установки пожаротушения
      - огнетушители в офисе не требуются
    object_facts:
      sufficient:
        - раздел 4 листа unit_office — 2 огнетушителя ОП-4 в зоне офиса
        - раздел 7 листа unit_office — часть 3 этажа 9-этажного бизнес-центра, до 8 человек в зоне офиса, поэтажный план бизнес-центра размещён
        - раздел 3 листа unit_office — АУПТ нет
      missing:
        - численность людей на 3 этаже и в здании бизнес-центра (уточняется у арендодателя)
        - количество постоянных рабочих мест на 3 этаже
        - категории помещений (раздел 2 — акт отсутствует)
      typed_fields:
        people_in_object_zone: 8
        people_on_floor_total: unknown
        people_in_building_total: unknown
        permanent_workplaces_on_floor: unknown
        evacuation_plan_present: false
        room_categories: unknown
        aupt_present: false
        extinguishers_total: 2
        outside_ladder_last_test_date: not_applicable
    norm:
      - {document_id: ext_ppr_1479, point: "п. 5", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 50", applies_to: здание (одновременно находящиеся люди), verified: true}
      - {document_id: ext_ppr_1479, point: "п. 5", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 10", applies_to: этаж (постоянные рабочие места), verified: true}
      - {document_id: ext_ppr_1479, point: "п. 400", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 2", applies_to: этаж общественного здания (огнетушители), verified: true}
      - {document_id: ext_ppr_1479, point: "п. 406 абз. 1", edition: "ред. от 03.02.2025 № 90", operator: "≤ 20 м", applies_to: помещение административного и общественного назначения (расстояние до огнетушителя), verified: true}
    expected:
      v1:
        status: needs_context
        reasons: [applicability_unclear]
        alternatives:
          - {status: answered, reasons: [], why: модель даёт условный вывод по плану со ссылками на лист (int), п. 5/п. 400 и Инструкцию, без clarifying_questions}
          - {status: needs_review, reasons: [internal_evidence_missing], why: процитированы только нормы ПП РФ № 1479, без листа и ЛНА}
      v2:
        status: needs_context
        reasons: [applicability_unclear]
        alternatives:
          - {status: answered, reasons: [], why: applied со ссылками obj + ext + int, недостающая численность названа в answer как «не найдено»; профиль датирован 01.09.2026}
          - {status: needs_review, reasons: [object_fact_normative], why: нормативный вывод (например «план не требуется») вынесен в object_facts}
    sources:
      - {document_id: ext_ppr_1479, section: "I. Общие положения, п. 5"}
      - {document_id: ext_ppr_1479, section: "XIX, п. 400"}
      - {document_id: ext_ppr_1479, section: "XIX, п. 406"}
      - {document_id: int_instr_mery_pb, section: "5.1.2.5"}
      - {document_id: int_instr_mery_pb, section: "5.13.3"}
      - {document_id: int_unit_office_list, section: "4 Первичные средства пожаротушения"}
      - {document_id: int_unit_office_list, section: "7 Планировка и эвакуация"}
  - n: 2
    unit_id: unit_dispatch
    question: Сколько огнетушителей должно быть на объекте и нужен ли план эвакуации?
    checks: составной вопрос, объект с АУГП и 60 чел.
    required_subanswers:
      - план эвакуации нужен — в здании одновременно до 60 человек, это 50 и более (п. 5 ПП РФ № 1479)
      - тип и ранг огнетушителей определяются по категории помещения и классу пожара (приложение № 1 ПП РФ № 1479); для серверной и электрощитовой (В3/В4, класс E) — 55В, С, Е или 2А, 55В, С, Е
      - серверная с АУГП обеспечивается огнетушителями на 50 % расчётного количества (п. 405), а не освобождается от них
      - фактически 6 огнетушителей (1 этаж — 4, 2 этаж — 2); точное требуемое количество без площадей помещений не вычисляется
    accepted_alternatives:
      - дополнительно указание на п. 400 (не менее 2 на этаж общественного здания) и п. 406 (расстояния 20 м / 30 м)
      - источник нормы — пп. 5.1.2.5, 5.13.2–5.13.5 Инструкции о мерах ПБ вместо или вместе с ПП РФ № 1479
      - упоминание, что план эвакуации на объекте разработан и размещён на каждом этаже
      - вопрос в clarifying_questions о площадях помещений для расчёта количества
    forbidden_conclusions:
      - план эвакуации не нужен
      - в серверной с АУГП огнетушители не требуются
      - количество огнетушителей снижается на 50 % для всего объекта
      - план нужен, потому что на 2 этаже 50 и более человек
    object_facts:
      sufficient:
        - раздел 7 листа unit_dispatch — здание целиком, одновременно до 60 человек, на 2 этаже до 45; план разработан
        - раздел 2 листа unit_dispatch — серверная В3/E, электрощитовая В4/E, 2 этаж общественного назначения
        - раздел 3 листа unit_dispatch — АУГП в серверной
        - раздел 4 листа unit_dispatch — 6 огнетушителей ОП-4/ОП-5
      missing:
        - площади помещений (для точного расчёта количества)
    norm:
      - {document_id: ext_ppr_1479, point: "п. 5", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 50", applies_to: здание (одновременно находящиеся люди; 60 — по зданию, объект занимает здание целиком), verified: true}
      - {document_id: ext_ppr_1479, point: "приложение № 1", edition: "ред. от 24.10.2022 № 1885", operator: "ранг не ниже 55В, С, Е или 2А, 55В, С, Е", applies_to: помещение категории А, Б, В1–В4, класс пожара E, verified: true}
      - {document_id: ext_ppr_1479, point: "п. 405", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "= 50 % расчётного количества", applies_to: помещение с автоматической установкой пожаротушения, verified: true}
      - {document_id: ext_ppr_1479, point: "п. 400", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 2", applies_to: этаж общественного здания, verified: true}
    expected:
      v1:
        status: answered
        reasons: []
        alternatives:
          - {status: needs_context, reasons: [applicability_unclear], why: модель спрашивает площади помещений для расчёта}
          - {status: needs_review, reasons: [internal_evidence_missing], why: процитированы только нормы ПП РФ № 1479}
      v2:
        status: answered
        reasons: []
        alternatives:
          - {status: needs_context, reasons: [applicability_unclear], why: модель спрашивает площади помещений для расчёта}
          - {status: needs_review, reasons: [internal_evidence_missing], why: applied со ссылками obj + ext без ЛНА}
    sources:
      - {document_id: ext_ppr_1479, section: "I. Общие положения, п. 5"}
      - {document_id: ext_ppr_1479, section: "XIX, п. 405"}
      - {document_id: ext_ppr_1479, section: "приложение № 1"}
      - {document_id: int_instr_mery_pb, section: "5.1.2.5"}
      - {document_id: int_instr_mery_pb, section: "5.13.2, 5.13.5"}
      - {document_id: int_unit_dispatch_list, section: "2 Категории помещений"}
      - {document_id: int_unit_dispatch_list, section: "3 Системы противопожарной защиты объекта"}
      - {document_id: int_unit_dispatch_list, section: "4 Первичные средства пожаротушения"}
      - {document_id: int_unit_dispatch_list, section: "7 Планировка и эвакуация"}
  - n: 3
    unit_id: unit_depot
    question: Действует ли у нас инструкция для складских помещений и когда испытывать наружную пожарную лестницу?
    checks: факт + норма
    required_subanswers:
      - да, на объекте действует Инструкция о мерах пожарной безопасности в складских и подсобных помещениях
      - эксплуатационные испытания наружной пожарной лестницы — не реже 1 раза в 5 лет с составлением протокола
      - дата последнего испытания в сведениях не указана, срок следующего испытания не вычисляется
    accepted_alternatives:
      - источник периодичности — п. 5.1.2.12 Инструкции о мерах ПБ вместо или вместе с п. 17 «б» ПП РФ № 1479
      - вопрос в clarifying_questions о дате последнего испытания
      - ссылка на п. 5.12 Инструкции о мерах ПБ как на документ, устанавливающий требования к складам
    forbidden_conclusions:
      - периодичность испытаний определяется только протоколом объекта (без предела 5 лет)
      - конкретная дата следующего испытания
      - инструкция для складских помещений на объекте не действует
    object_facts:
      sufficient:
        - раздел 9 листа unit_depot — действует Инструкция о мерах ПБ в складских и подсобных помещениях
        - раздел 8 листа unit_depot — есть наружная металлическая лестница на кровлю
      missing:
        - дата последнего испытания лестницы ([дата])
    expected:
      v1:
        status: answered
        reasons: []
        alternatives:
          - {status: needs_context, reasons: [applicability_unclear], why: модель спрашивает дату последнего испытания}
          - {status: needs_review, reasons: [external_evidence_missing], why: цитируются лист и Инструкция без ПП РФ № 1479}
      v2:
        status: answered
        reasons: []
        alternatives:
          - {status: needs_context, reasons: [applicability_unclear], why: модель спрашивает дату последнего испытания}
          - {status: needs_review, reasons: [external_evidence_missing], why: applied со ссылками obj + int без ПП РФ № 1479}
          - {status: needs_review, reasons: [internal_evidence_missing], why: applied со ссылками obj + ext без Инструкции}
    sources:
      - {document_id: ext_ppr_1479, section: "I. Общие положения, п. 17 «б»"}
      - {document_id: int_instr_mery_pb, section: "5.1.2.12"}
      - {document_id: int_instr_mery_pb, section: "5.12"}
      - {document_id: int_unit_depot_list, section: "8 Технические особенности"}
      - {document_id: int_unit_depot_list, section: "9 Складские и подсобные помещения"}
