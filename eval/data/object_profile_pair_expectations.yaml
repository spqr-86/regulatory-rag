  - n: 7
    unit_id: unit_partial
    question: Нужен ли на нашем объекте план эвакуации?
    checks: граница ровно 50
    required_subanswers:
      - да, план эвакуации нужен — одновременно ровно 50 человек, а норма «50 и более» включает границу
      - сведений о разработанном плане эвакуации нет
    accepted_alternatives:
      - обоснование через здание: на этаже 50 человек, значит в здании не менее 50
      - дополнительно условие о 10 и более постоянных рабочих местах на этаже
      - источник — п. 5.1.2.5 Инструкции о мерах ПБ вместо или вместе с п. 5 ПП РФ № 1479
    forbidden_conclusions:
      - план не нужен, потому что людей не больше 50 (или нужно больше 50)
      - план эвакуации на объекте разработан / есть
    object_facts:
      sufficient:
        - раздел 7 листа unit_partial — весь 2 этаж, одновременно ровно 50 человек, все на одном этаже
      missing:
        - сведения о плане эвакуации («сведений нет»)
        - дата заполнения листа
      typed_fields:
        people_in_object_zone: 50
        people_on_floor_total: 50
        people_in_building_total: unknown
        permanent_workplaces_on_floor: unknown
        evacuation_plan_present: unknown
    norm:
      - {document_id: ext_ppr_1479, point: "п. 5", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 50", applies_to: здание (одновременно находящиеся люди; 50 на этаже — нижняя граница для здания), verified: true}
      - {document_id: ext_ppr_1479, point: "п. 5", edition: "исходная редакция, в ред. № 90 не изменялся", operator: "≥ 10", applies_to: этаж (постоянные рабочие места; для учебного класса не основное условие), verified: true}
    expected:
