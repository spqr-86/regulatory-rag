  - n: 9
    unit_id: unit_office
    question: Есть ли огнезащитная обработка конструкций в зоне офиса и как часто её проверять?
    checks: present, но факт неизвестен, профиль датирован
    required_subanswers:
      - наличие огнезащитной обработки по сведениям об объекте не известно — уточняется у арендодателя
      - проверка состояния огнезащитного покрытия — по технической документации изготовителя средства огнезащиты или производителя работ, при отсутствии в ней периодичности — не реже 1 раза в год
    accepted_alternatives:
      - вопрос в clarifying_questions о наличии обработки или документации у арендодателя
      - указание, что во внутренних документах требования о периодичности не найдены
    forbidden_conclusions:
      - огнезащитная обработка выполнена / есть
      - огнезащитной обработки нет
      - проверка проводится реже 1 раза в год при отсутствии сведений в технической документации
    object_facts:
      sufficient:
