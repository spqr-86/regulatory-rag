        status: answered
        reasons: []
        alternatives:
          - {status: needs_context, reasons: [applicability_unclear], why: модель спрашивает о численности в здании или о характере рабочих мест}
          - {status: needs_review, reasons: [internal_evidence_missing], why: процитирован только п. 5 ПП РФ № 1479}
      v2:
        status: needs_review
        reasons: [object_profile_undated]
        alternatives:
          - {status: needs_review, reasons: [internal_evidence_missing, object_profile_undated], why: applied со ссылками obj + ext без ЛНА}
          - {status: needs_review, reasons: [external_evidence_missing, object_profile_undated], why: applied со ссылками obj + int без ПП РФ № 1479}
          - {status: needs_context, reasons: [applicability_unclear], why: модель задаёт уточняющий вопрос; decide() возвращает needs_context до проверки даты, поэтому object_profile_undated здесь не появляется (§2.3, порядок проверок)}
    sources:
