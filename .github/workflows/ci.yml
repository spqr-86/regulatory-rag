name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-mock ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run fast tests
        env:
          GEMINI_API_KEY: stub
          OPENAI_API_KEY: stub
        run: python -m pytest -m "not integration and not slow" -v --tb=short

      - name: Docs freshness check
        run: python scripts/check_docs.py --ci
